name: Apply linter carriers patch

on:
  push:
    branches: [feat/linter-bundles]
    paths:
      - scripts/apply-linter-carriers-patch.py
      - riglib/linter_carriers.py

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/linter-bundles
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Apply patch
        run: python scripts/apply-linter-carriers-patch.py
      - name: Compile
        run: python -m compileall -q riglib
      - name: Existing linter tests
        run: uv run --with pytest --with pyyaml pytest tests/test_linters.py tests/test_config_schema.py -q
      - name: Commit generated implementation
        run: |
          rm scripts/apply-linter-carriers-patch.py .github/workflows/apply-linter-carriers-patch.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'feat: implement reusable linter carriers'
          git push origin HEAD:feat/linter-bundles
