name: Finish lint introspection and formatter default
on:
  push:
    branches: [fix/linter-readiness-detection]
permissions:
  contents: write
jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/linter-readiness-detection
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reapply implementation and address review
        run: |
          python - <<'PY'
          from pathlib import Path
          wf = Path('.github/workflows/followup-lint-cli-format.yml').read_text().splitlines()
          start = next(i for i,l in enumerate(wf) if "python - <<'PY'" in l) + 1
          end = next(i for i in range(start, len(wf)) if wf[i].strip() == 'PY')
          lines = wf[start:end]
          indent = min(len(x) - len(x.lstrip()) for x in lines if x.strip())
          Path('/tmp/impl.py').write_text('\n'.join(x[indent:] for x in lines) + '\n')
          PY
          python /tmp/impl.py
          python - <<'PY'
          from pathlib import Path
          p = Path('riglib/linter_environment.py')
          text = p.read_text()
          text = text.replace('import json\n', 'import json\nimport shlex\n', 1)
          old = '''def _script_text(manifest: dict[str, Any]) -> str:\n    scripts = manifest.get("scripts")\n    if not isinstance(scripts, dict):\n        return ""\n    return "\\n".join(value for value in scripts.values() if isinstance(value, str)).lower()\n'''
          new = old + '''\n\ndef _script_tokens(manifest: dict[str, Any]) -> set[str]:\n    """Executable/package tokens in package scripts; exact tokens avoid `standard-version` false positives."""\n    scripts = manifest.get("scripts")\n    if not isinstance(scripts, dict):\n        return set()\n    out: set[str] = set()\n    for value in scripts.values():\n        if not isinstance(value, str):\n            continue\n        try:\n            parts = shlex.split(value, posix=True)\n        except ValueError:\n            parts = value.split()\n        for part in parts:\n            token = part.strip().lower().replace("\\\\", "/").rsplit("/", 1)[-1]\n            if token and token not in {"&&", "||", ";", "|"}:\n                out.add(token)\n    return out\n'''
          if old not in text:
              raise SystemExit('script_text anchor missing')
          text = text.replace(old, new, 1)
          old2 = '''def _foreign_from_scripts(manifest: dict[str, Any]) -> set[str]:\n    text = _script_text(manifest)\n    found: set[str] = set()\n    token_map = {\n        "eslint": "ESLint",\n        "biome": "Biome",\n        "standard": "StandardJS",\n        "xo": "XO",\n        "tslint": "TSLint",\n    }\n    for token, label in token_map.items():\n        if token in text:\n            found.add(label)\n    return found\n'''
          new2 = '''def _foreign_from_scripts(manifest: dict[str, Any]) -> set[str]:\n    tokens = _script_tokens(manifest)\n    found: set[str] = set()\n    token_map = {\n        "eslint": "ESLint",\n        "biome": "Biome",\n        "standard": "StandardJS",\n        "xo": "XO",\n        "tslint": "TSLint",\n    }\n    for token, label in token_map.items():\n        if token in tokens:\n            found.add(label)\n    return found\n'''
          if old2 not in text:
              raise SystemExit('foreign scripts anchor missing')
          text = text.replace(old2, new2, 1)
          text = text.replace(
              '    scripts = _script_text(manifest)\n    for token, label in (("prettier", "Prettier"), ("biome", "Biome"), ("dprint", "dprint")):\n        if token in scripts:\n            foreign.add(label)',
              '    script_tokens = _script_tokens(manifest)\n    for token, label in (("prettier", "Prettier"), ("biome", "Biome"), ("dprint", "dprint")):\n        if token in script_tokens:\n            foreign.add(label)',
              1,
          )
          p.write_text(text)

          p = Path('tests/test_lint_cli_and_formatter.py')
          text = p.read_text()
          text = text.replace(
              'rc = main(["lint", "rules", "anti-slop/no-optional-function-parameters", "-C", str(repo), "--json"])',
              'rc = main(["lint", "rules", "anti-slop/no-optional-function-parameters", "-C", str(repo), "--config", str(repo / "rig.yaml"), "--json"])',
              1,
          )
          text += '''\n\ndef test_script_detection_does_not_confuse_standard_version_with_standardjs(tmp_path):\n    from riglib.linter_environment import inspect_linter_environment\n    repo = tmp_path / "repo"; repo.mkdir(); _pkg(repo, {}, {"release": "standard-version"})\n    env = inspect_linter_environment(repo)\n    assert "StandardJS" not in env.foreign_linters\n\ndef test_script_detection_sees_exact_standard_executable(tmp_path):\n    from riglib.linter_environment import inspect_linter_environment\n    repo = tmp_path / "repo"; repo.mkdir(); _pkg(repo, {}, {"lint": "npx standard src"})\n    env = inspect_linter_environment(repo)\n    assert "StandardJS" in env.foreign_linters\n'''
          p.write_text(text)
          PY
      - name: Validate
        run: |
          pip install -e '.[test]' pyyaml
          python -m pytest -q tests/test_lint_cli_and_formatter.py tests/test_linter_environment.py tests/test_lint_followups.py tests/test_linters.py
          python -m pytest -q
      - name: Commit
        run: |
          rm -f .github/workflows/followup-lint-cli-format.yml .github/workflows/followup-lint-cli-format-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "feat: add lint policy introspection and Oxfmt default"
          git push origin HEAD:fix/linter-readiness-detection
