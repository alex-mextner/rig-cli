name: Implement config-set preview
on: [push]
permissions:
  contents: write
jobs:
  implement:
    if: github.ref == 'refs/heads/fix/linter-readiness-detection'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/linter-readiness-detection
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Implement prospective config planning
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p=Path(path); t=p.read_text()
              if old not in t:
                  raise SystemExit(f'anchor missing in {path}: {old[:120]!r}')
              p.write_text(t.replace(old,new,count))

          # config.load: support an in-memory prospective layer so previews never write then roll back.
          p=Path('riglib/config.py'); t=p.read_text()
          t=t.replace(
              '''def load(\n    repo_root: Path,\n    *,\n    explicit_config: Path | None = None,\n    include_global: bool = True,\n    include_repo: bool = True,\n) -> LoadedConfig:''',
              '''def load(\n    repo_root: Path,\n    *,\n    explicit_config: Path | None = None,\n    include_global: bool = True,\n    include_repo: bool = True,\n    layer_overrides: dict[Path, dict[str, Any]] | None = None,\n) -> LoadedConfig:''',1)
          t=t.replace(
              '''    repo_root = repo_root.resolve()\n    merged: dict[str, Any] = {}''',
              '''    repo_root = repo_root.resolve()\n    overrides = {Path(path).resolve(): dict(data) for path, data in (layer_overrides or {}).items()}\n    merged: dict[str, Any] = {}''',1)
          t=t.replace(
              '''        nonlocal merged\n        data = read_yaml_file(path)''',
              '''        nonlocal merged\n        resolved_path = path.resolve()\n        data = dict(overrides[resolved_path]) if resolved_path in overrides else read_yaml_file(path)''',1)
          t=t.replace(
              '''        gpath = global_config_path()\n        if gpath.is_file():\n            _merge_layer(gpath, "global")''',
              '''        gpath = global_config_path()\n        if gpath.is_file() or gpath.resolve() in overrides:\n            _merge_layer(gpath, "global")''',1)
          t=t.replace(
              '''            rpath = explicit_config.resolve()\n            if not rpath.is_file():\n                raise ConfigError(f"--config file not found: {rpath}")''',
              '''            rpath = explicit_config.resolve()\n            if not rpath.is_file() and rpath not in overrides:\n                raise ConfigError(f"--config file not found: {rpath}")''',1)
          t=t.replace(
              '''            rpath = repo_config_path(repo_root)\n            if rpath.is_file():\n                _merge_layer(rpath, "repo")''',
              '''            rpath = repo_config_path(repo_root)\n            if rpath.is_file() or rpath.resolve() in overrides:\n                _merge_layer(rpath, "repo")''',1)
          p.write_text(t)

          # cli parser: preview by default; explicit --commit executes; --no-apply remains explicit write-only compatibility.
          p=Path('riglib/cli.py'); t=p.read_text()
          old='''    cs = csub.add_parser("set", help="write a nested config key, then reconcile (apply)")\n    cs.add_argument("path", help="dot path into the config tree (e.g. harness.auto_mode)")\n    cs.add_argument("value", help="value to set (coerced: true/false/int/float/null, else string)")\n    _add_config_target_args(cs)\n    cs.add_argument("--no-apply", action="store_true",\n                    help="write the key but skip the reconcile (print the resulting plan only)")'''
          new='''    cs = csub.add_parser("set", help="preview a nested config change; --commit writes + reconciles")\n    cs.add_argument("path", help="dot path into the config tree (e.g. harness.auto_mode)")\n    cs.add_argument("value", help="value to set (coerced: true/false/int/float/null, else string)")\n    _add_config_target_args(cs)\n    set_mode = cs.add_mutually_exclusive_group()\n    set_mode.add_argument("--commit", action="store_true",\n                          help="write the validated config change and execute the resulting reconcile")\n    set_mode.add_argument("--no-apply", action="store_true",\n                          help="write the validated config change but do not reconcile (legacy write-only mode)")'''
          if old not in t: raise SystemExit('config set parser anchor missing')
          t=t.replace(old,new,1)
          t=t.replace(
              '''    from .config import load\n    from .plan import build''',
              '''    from .config import load\n    from .plan import build''',1)
          # load-plan accepts prospective layer overlays.
          t=t.replace(
              '''def _load_plan(\n    cwd: str,\n    config: str | None,\n    project_type_override: str | None = None,\n    *,\n    allow_repo_autodiscovery_in_non_git: bool = True,\n):''',
              '''def _load_plan(\n    cwd: str,\n    config: str | None,\n    project_type_override: str | None = None,\n    *,\n    allow_repo_autodiscovery_in_non_git: bool = True,\n    layer_overrides: dict[Path, dict] | None = None,\n):''',1)
          t=t.replace(
              '''    loaded = load(env.repo_root, explicit_config=explicit, include_repo=include_repo)''',
              '''    loaded = load(\n        env.repo_root, explicit_config=explicit, include_repo=include_repo, layer_overrides=layer_overrides\n    )''',1)
          # isolation validator accepts in-memory layer.
          t=t.replace(
              '''def _validate_layer_in_isolation(layer_path: Path) -> None:''',
              '''def _validate_layer_in_isolation(\n    layer_path: Path, *, data_override: dict | None = None\n) -> None:''',1)
          t=t.replace(
              '''    loaded = load(layer_path.parent, explicit_config=layer_path, include_global=False)''',
              '''    loaded = load(\n        layer_path.parent,\n        explicit_config=layer_path,\n        include_global=False,\n        layer_overrides=({layer_path.resolve(): data_override} if data_override is not None else None),\n    )''',1)

          # Replace the write-before-plan block with prospective planning, then an explicit commit/write-only path.
          start = t.index('    # Capture the previous bytes BEFORE writing so a write IO error OR a SECOND, deeper')
          end_marker = '\n\ndef cmd_install_skill(args: argparse.Namespace) -> int:'
          end = t.index(end_marker, start)
          old_block = t[start:end]
          new_block = '''    # PLAN THE PROSPECTIVE CHANGE IN MEMORY FIRST. Preview is the default and MUST NOT\n    # transiently write the config just to learn the resulting plan. The same validated plan is\n    # later executed by --commit, so preview and execution cannot resolve different policy.\n    try:\n        if args.is_global:\n            _validate_layer_in_isolation(target, data_override=data)\n        plan, _loaded, _env = _load_plan(\n            args.cwd, config=None, layer_overrides={target.resolve(): data}\n        )\n    except Exception as exc:  # noqa: BLE001\n        if isinstance(exc, ConfigError):\n            print(_err_block(exc))\n        else:\n            kind = "" if isinstance(exc, (CatalogError, PlanError, OSError)) else f"{type(exc).__name__}: "\n            print(_err(f"error: {kind}{exc}"))\n        return 2\n\n    if not args.commit and not args.no_apply:\n        print(_bold(f"Would set {config_path} = {_fmt_scalar(value)}  → {target}"))\n        _print_plan(plan, full=getattr(args, "plan", False), preview=True)\n        print(_dim("\\n(preview only: config and disk are unchanged; add --commit to write + reconcile)"))\n        return 0\n\n    # Explicit mutation path. Capture the previous bytes so a write/serialization failure can be\n    # rolled back. (A later reconcile error does not revert a valid committed policy change.)\n    original = target.read_text(encoding="utf-8") if target.is_file() else None\n    parent_existed = target.parent.exists()\n\n    def _rollback() -> bool:\n        try:\n            if original is None:\n                target.unlink(missing_ok=True)\n                if not parent_existed:\n                    with contextlib.suppress(OSError):\n                        target.parent.rmdir()\n            else:\n                target.write_text(original, encoding="utf-8")\n        except OSError:\n            return False\n        return True\n\n    try:\n        target.parent.mkdir(parents=True, exist_ok=True)\n        state = SetupState.from_dict(data)\n        if args.is_global:\n            target.write_text(state.to_yaml(), encoding="utf-8")\n        else:\n            state.write(target)\n    except Exception as exc:  # noqa: BLE001\n        restored = _rollback()\n        if isinstance(exc, ConfigError):\n            print(_err_block(exc))\n        else:\n            print(_err(f"error: {type(exc).__name__}: {exc}"))\n        if restored:\n            print(_dim(f"  (config not changed — {target} left untouched)"))\n        else:\n            print(_err(f"  WARNING: could not restore {target} — it may contain the rejected edit"))\n        return 2\n\n    print(_ok(f"set {config_path} = {_fmt_scalar(value)}  → {target}"))\n    _print_plan(plan, full=getattr(args, "plan", False))\n    if args.no_apply:\n        print(_dim("\\n(--no-apply: config written, nothing reconciled)"))\n        return 0\n    report = run_plan(plan)\n    _print_results(report)\n    return 1 if report.errors else 0\n'''
          t=t[:start]+new_block+t[end:]
          # Command-level help/docs strings.
          t=t.replace('rig config   get/set ONE config key by dot path, then reconcile (get|set)',
                      'rig config   get/set ONE config key by dot path; set previews by default, --commit reconciles')
          t=t.replace('cp = sub.add_parser("config", help="get/set a single config key (dot path), then reconcile")',
                      'cp = sub.add_parser("config", help="get/set one config key; set previews by default")')
          p.write_text(t)

          # Existing config-set tests describe the old implicit-commit contract. Add --commit to every
          # existing set invocation except the intentional --no-apply/write-only test; new preview tests live separately.
          p=Path('tests/test_config_getset.py'); source=p.read_text()
          import ast
          tree=ast.parse(source)
          inserts=[]
          for node in ast.walk(tree):
              if not isinstance(node, ast.Call) or not isinstance(node.func, ast.Name) or node.func.id != 'main' or not node.args:
                  continue
              arg=node.args[0]
              if not isinstance(arg, ast.List) or len(arg.elts)<2:
                  continue
              vals=[]
              for elt in arg.elts:
                  vals.append(elt.value if isinstance(elt, ast.Constant) and isinstance(elt.value,str) else None)
              if vals[:2] != ['config','set'] or '--commit' in vals or '--no-apply' in vals:
                  continue
              inserts.append((arg.end_lineno,arg.end_col_offset))
          lines=source.splitlines(keepends=True)
          # convert line/col to absolute offsets and insert from the end
          starts=[]; off=0
          for line in lines: starts.append(off); off += len(line)
          for lineno,col in sorted(inserts, key=lambda x:(x[0],x[1]), reverse=True):
              pos=starts[lineno-1]+col-1  # before closing ]
              source=source[:pos]+', "--commit"'+source[pos:]
          source=source.replace('`rig config get|set` — the targeted read/edit-then-reconcile command.',
                                '`rig config get|set` — targeted reads and preview-by-default config transactions.')
          source=source.replace('and that `set` triggers the same\nplan+apply reconcile `rig apply` runs',
                                'and that `set --commit` triggers the same\nplan+apply reconcile `rig apply` runs')
          p.write_text(source)

          Path('tests/test_config_set_preview.py').write_text('''from pathlib import Path\n\nfrom riglib import config\nfrom riglib.cli import main\n\ndef _w(path: Path, text: str):\n    path.parent.mkdir(parents=True, exist_ok=True)\n    path.write_text(text, encoding="utf-8")\n\ndef _base(repo: Path, agent_tools):\n    _w(repo / "rig.yaml", f"version: 1\\nagent_tools_source: {agent_tools}\\nskills: {{enabled: false}}\\nagent_hooks: {{enabled: false}}\\nci: {{enabled: false}}\\nmcp: {{enabled: false}}\\ngit_hooks: {{dispatcher: {{enabled: false}}}}\\nharness: {{auto_mode: true}}\\n")\n\ndef test_config_set_is_preview_by_default(tmp_path, fake_agent_tools, monkeypatch, capsys):\n    monkeypatch.setenv("XDG_CONFIG_HOME", str(tmp_path / "no-global"))\n    repo=tmp_path/"repo"; repo.mkdir(); _base(repo, fake_agent_tools)\n    before=(repo/"rig.yaml").read_bytes()\n    rc=main(["config","set","harness.auto_mode","false","-C",str(repo)])\n    out=capsys.readouterr().out\n    assert rc == 0\n    assert (repo/"rig.yaml").read_bytes() == before\n    assert "Would set harness.auto_mode = false" in out\n    assert "PREVIEW" in out and "--commit" in out\n\ndef test_config_set_commit_writes_change(tmp_path, fake_agent_tools, monkeypatch):\n    monkeypatch.setenv("XDG_CONFIG_HOME", str(tmp_path / "no-global"))\n    repo=tmp_path/"repo"; repo.mkdir(); _base(repo, fake_agent_tools)\n    rc=main(["config","set","harness.auto_mode","false","-C",str(repo),"--commit"])\n    assert rc == 0\n    assert config.load(repo).data["harness"]["auto_mode"] is False\n\ndef test_global_config_set_preview_does_not_create_global_file(tmp_path, fake_agent_tools, monkeypatch, capsys):\n    monkeypatch.setenv("XDG_CONFIG_HOME", str(tmp_path / "xdg"))\n    repo=tmp_path/"repo"; repo.mkdir(); _base(repo, fake_agent_tools)\n    gpath=config.global_config_path()\n    assert not gpath.exists()\n    rc=main(["config","set","defaults.on_conflict","overwrite","-C",str(repo),"--global"])\n    assert rc == 0 and not gpath.exists()\n    assert "Would set defaults.on_conflict = overwrite" in capsys.readouterr().out\n\ndef test_no_apply_remains_explicit_write_only(tmp_path, fake_agent_tools, monkeypatch):\n    monkeypatch.setenv("XDG_CONFIG_HOME", str(tmp_path / "no-global"))\n    repo=tmp_path/"repo"; repo.mkdir(); _base(repo, fake_agent_tools)\n    rc=main(["config","set","harness.auto_mode","false","-C",str(repo),"--no-apply"])\n    assert rc == 0\n    assert config.load(repo).data["harness"]["auto_mode"] is False\n''')
          PY
      - name: Update docs
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('README.md'); t=p.read_text()
          old='''| `rig config get\\|set` | **The headless counterpart to the wizard** — read/edit ONE nested key by **dot path**, then reconcile. `get <dot.path>` reads one key from the single target file (`./rig.yaml`, or `--global`); `--json` emits the raw value, a subtree prints as YAML. `set <dot.path> <value>` coerces the value conservatively (`true`/`false`/int/float/null; `09`/`1e3`/underscored/Unicode-digit values stay strings), writes it, then runs the **same apply engine** as `rig apply` (full rollback if the write or the catalog-backed plan build fails). `--global` targets `~/.config/rig/config.yaml`; `--no-apply` writes the key and prints the plan only. |'''
          new='''| `rig config get\\|set` | **The headless counterpart to the wizard.** `get` reads one nested key. `set <dot.path> <value>` is **preview-by-default**: it validates the prospective config entirely in memory, shows the config change + resulting reconcile plan, and writes nothing. Add **`--commit`** to write the change and execute that same validated plan; `--no-apply` is the explicit legacy write-only mode. `--global` targets `~/.config/rig/config.yaml`. |'''
          if old in t: t=t.replace(old,new,1)
          t=t.replace('headless counterpart `rig config get <dot.path>` / `rig config set <dot.path> <value>` — a\ndot-path editor that reads/edits one nested key then reconciles (`--global` targets the global\nconfig, `--no-apply` writes without converging).',
                      'headless counterpart `rig config get <dot.path>` / `rig config set <dot.path> <value>` — a\ndot-path editor whose writes are previewed by default. Add `--commit` to write + reconcile;\n`--global` targets the global config and `--no-apply` is explicit write-only mode.')
          anchor='![rig apply converges the repo to rig.yaml; rig status reports drift both ways](./docs/img/reconcile.svg)\n'
          section='''\n## One development culture, from one control plane\n\nRig treats development setup and engineering policy as one declarative system rather than a pile of unrelated dotfiles. A global machine layer can establish defaults; committed `rig.yaml` files make repository-specific differences reviewable and reproducible. The same engine previews, applies, verifies, and reports drift.\n\nThat control plane already spans coding-agent skills and hooks, git hooks, CI gates, MCP servers, harness permissions/auto-mode, GitHub/repository settings, project-tool integrations, model/tool maintenance, and now JS/TS lint/format policy through Oxlint/Oxfmt + anti-slop. The intent is that humans and coding agents encounter the same constraints and preferred practices instead of each harness or repository inventing its own culture.\n\nWhere the surrounding tool exposes a preventative boundary, Rig installs a guardrail; where it cannot, CI/status/verification can still detect drift or unsafe state. The next cross-domain enforcement/advise model is tracked in [#225](https://github.com/alex-mextner/rig-cli/issues/225), with consistent better-practice recommendations in [#229](https://github.com/alex-mextner/rig-cli/issues/229).\n\nThis is useful for a team, but also for one developer with many repos and several agents: one policy source reduces setup drift, makes a new checkout predictable, and makes agent behavior less dependent on whichever harness happened to start the session. A dedicated onboarding/attestation command is tracked in [#228](https://github.com/alex-mextner/rig-cli/issues/228).\n\nToday Rig already has machine-wide global defaults plus per-repository overrides. The broader “change once everywhere” layer is explicit roadmap work rather than a hidden promise: fleet reconciliation [#222](https://github.com/alex-mextner/rig-cli/issues/222), repository/stack/tag targeting [#227](https://github.com/alex-mextner/rig-cli/issues/227) and [#233](https://github.com/alex-mextner/rig-cli/issues/233), shareable team policy packs [#223](https://github.com/alex-mextner/rig-cli/issues/223), and cross-domain `rig rules` / explain [#224](https://github.com/alex-mextner/rig-cli/issues/224). The goal is to change lint, CI, hooks, agent capabilities, skills, MCP and other development policy globally—or only for the relevant stacks/projects—with one previewable operation.\n'''
          if '## One development culture, from one control plane' not in t:
              t=t.replace(anchor,anchor+section,1)
          p.write_text(t)

          p=Path('docs/config-schema.md'); t=p.read_text()
          t=t.replace('**`rig apply` / `rig config set` / `rig status` / `rig init`** validate against the registry',
                      '**`rig apply` / `rig config set` / `rig status` / `rig init`** validate against the registry')
          if '### `rig config set` preview/commit contract' not in t:
              marker='## `linters`\n'
              note='''### `rig config set` preview/commit contract\n\n`rig config set <path> <value>` validates the prospective target layer and builds the resulting reconcile plan **without writing the config file**. Add `--commit` to write the already-validated change and execute that plan. `--no-apply` remains an explicit write-only compatibility mode. This mirrors `rig apply`: inspection is safe by default; mutation requires explicit intent.\n\n'''
              t=t.replace(marker,note+marker,1)
          p.write_text(t)
          PY
      - name: Test
        run: |
          pip install -e '.[test]' pyyaml
          python -m pytest -q tests/test_config_getset.py tests/test_config_set_preview.py tests/test_config.py tests/test_cli.py
          python -m pytest -q
      - name: Commit implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+alex-mextner@users.noreply.github.com
          git add riglib/config.py riglib/cli.py tests/test_config_getset.py tests/test_config_set_preview.py README.md docs/config-schema.md
          git diff --cached --quiet || git commit -m 'feat: make config set preview-by-default'
          git push
