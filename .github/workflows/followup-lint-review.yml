name: Follow-up merged lint review
on:
  push:
    branches: [fix/linter-readiness-detection]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/linter-readiness-detection
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch review findings
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path); text = p.read_text()
              if old not in text:
                  raise SystemExit(f"anchor not found in {path}: {old[:100]!r}")
              p.write_text(text.replace(old, new, count))

          # 1) Three explicit managed-file classes.
          Path('riglib/managed_config.py').write_text('''"""Syntax-aware ownership headers for Rig-managed text files."""\nfrom __future__ import annotations\n\nfrom pathlib import PurePosixPath\n\nGENERATED = "generated"\nSOURCE_BACKED = "source-backed"\nMARKER_MANAGED = "marker-managed"\nMANAGEMENT_CLASSES = {GENERATED, SOURCE_BACKED, MARKER_MANAGED}\n\n_SLASH_COMMENT_EXTENSIONS = {".ts", ".js", ".mjs", ".cjs", ".mts", ".cts", ".jsonc"}\n_HASH_COMMENT_EXTENSIONS = {".toml", ".yaml", ".yml", ".ini", ".cfg", ".conf", ".properties", ".env"}\n\ndef _prefix(rel_path: str) -> str:\n    suffix = PurePosixPath(rel_path).suffix.lower()\n    if suffix in _SLASH_COMMENT_EXTENSIONS:\n        return "//"\n    if suffix in _HASH_COMMENT_EXTENSIONS:\n        return "#"\n    return ""\n\ndef managed_header(rel_path: str, *, source: str = "global Rig config + rig.yaml", management_class: str = GENERATED) -> str:\n    """Return the ownership contract header, or empty for comment-forbidden formats."""\n    if management_class not in MANAGEMENT_CLASSES:\n        raise ValueError(f"unknown Rig management class: {management_class}")\n    prefix = _prefix(rel_path)\n    if not prefix:\n        return ""\n    if management_class == GENERATED:\n        lines = [\n            f"Managed by Rig (generated). Source of truth: {source}.",\n            "Do not edit directly: `rig apply` reconciles the whole file. Temporary diagnostic edits are allowed locally,",\n            "but move the final change into Rig policy before commit.",\n        ]\n    elif management_class == SOURCE_BACKED:\n        lines = [\n            f"Managed by Rig (source-backed). Canonical source: {source}.",\n            "Do not edit this target directly: change the canonical source (or Rig selection) and run `rig apply`.",\n        ]\n    else:\n        lines = [\n            f"Partially managed by Rig (marker-managed). Policy source: {source}.",\n            "You may edit this file outside Rig BEGIN/END markers; edit inside a managed block via Rig config/source only.",\n        ]\n    return "\\n".join(f"{prefix} {line}" for line in lines) + "\\n\\n"\n\ndef with_managed_header(rel_path: str, content: str, *, source: str = "global Rig config + rig.yaml", management_class: str = GENERATED) -> str:\n    header = managed_header(rel_path, source=source, management_class=management_class)\n    if not header or content.startswith(header):\n        return content\n    return header + content\n''')

          # 2) Catalog owns provider carrier layout.
          p = Path('riglib/catalog.py'); text = p.read_text()
          addition = '''\n\n_RULE_PROVIDER_CARRIERS = {\n    "anti-slop": "vendor/anti-slop/skills/install-anti-slop/assets/anti-slop",\n}\n\ndef rule_provider_carrier(source: Path, provider: str) -> tuple[str, Path]:\n    """Resolve a provider's supported vendored payload; layout knowledge lives in the catalog."""\n    rel = _RULE_PROVIDER_CARRIERS.get(provider)\n    if rel is None:\n        raise CatalogError(f"unknown lint rule provider: {provider}")\n    path = source / rel\n    if not path.is_dir():\n        raise CatalogError(\n            f"lint provider {provider!r} payload is missing at {path}; initialize/update the pinned subrepo"\n        )\n    return rel, path\n'''
          if '_RULE_PROVIDER_CARRIERS' not in text:
              p.write_text(text.rstrip() + addition + '\n')

          # 3) Runtime validation wires documented linters.bundles.
          p = Path('riglib/config.py'); text = p.read_text()
          text = text.replace('LINTER_ITEM_KEYS = {"tool", "role", "path", "content", "source", "enabled"}',
                              'LINTER_ITEM_KEYS = {"tool", "role", "path", "content", "source", "enabled"}\nLINTER_BUNDLE_KEYS = {"source", "target", "enabled"}')
          text = text.replace('allowed = {"enabled", "preview", "rules", "items"}', 'allowed = {"enabled", "preview", "rules", "items", "bundles"}')
          text = text.replace('"unknown linters key: {unknown[0]} (accepted: enabled, preview, rules, items)"',
                              '"unknown linters key: {unknown[0]} (accepted: enabled, preview, rules, items, bundles)"')
          anchor = '    items = li.get("items", {})\n'
          block = '''    bundles = li.get("bundles", {})\n    if bundles is not None:\n        if not isinstance(bundles, dict):\n            raise ConfigError("linters.bundles must be a mapping", "linters.bundles")\n        for name, spec in bundles.items():\n            if not isinstance(name, str) or not name or not isinstance(spec, dict):\n                raise ConfigError("linters.bundles entries must be named mappings", f"linters.bundles.{name}")\n            unknown_bundle = sorted(set(spec) - LINTER_BUNDLE_KEYS)\n            if unknown_bundle:\n                raise ConfigError(f"unknown linters.bundles.{name} key: {unknown_bundle[0]}", f"linters.bundles.{name}.{unknown_bundle[0]}")\n            if spec.get("enabled") is not None and not isinstance(spec.get("enabled"), bool):\n                raise ConfigError(f"linters.bundles.{name}.enabled must be a bool", f"linters.bundles.{name}.enabled")\n            for key in ("source", "target"):\n                value = spec.get(key)\n                if not isinstance(value, str) or not value:\n                    raise ConfigError(f"linters.bundles.{name}.{key} is required", f"linters.bundles.{name}.{key}")\n                if linter_path_escapes_repo(value):\n                    raise ConfigError(f"linters.bundles.{name}.{key} must be a safe relative path", f"linters.bundles.{name}.{key}")\n\n'''
          if 'bundles = li.get("bundles"' not in text:
              text = text.replace(anchor, block + anchor, 1)
          p.write_text(text)

          # 4) Schema supports bundles and content XOR source.
          p = Path('riglib/config_schema.py'); text = p.read_text()
          text = text.replace('    additional_properties: Any | None = None\n    closed: bool = True',
                              '    additional_properties: Any | None = None\n    schema_extra: dict[str, Any] = field(default_factory=dict)\n    closed: bool = True')
          text = text.replace('        else:\n            node["additionalProperties"] = False if self.closed else True\n        return node',
                              '        else:\n            node["additionalProperties"] = False if self.closed else True\n        node.update(self.schema_extra)\n        return node', 1)
          text = text.replace('        "enabled": Leaf("boolean", "provision this one file", default=True),\n    },\n)\n\n_LINTERS_RULES_BLOCK',
                              '        "enabled": Leaf("boolean", "provision this one file", default=True),\n    },\n    schema_extra={"oneOf": [\n        {"required": ["content"], "not": {"required": ["source"]}},\n        {"required": ["source"], "not": {"required": ["content"]}},\n    ]},\n)\n\n_LINTERS_BUNDLE_ITEM_BLOCK = Block(\n    doc="one deterministic directory bundle copied from agent-tools",\n    leaves={\n        "source": Leaf("string", "agent-tools-relative source directory"),\n        "target": Leaf("string", "repo-relative destination directory"),\n        "enabled": Leaf("boolean", "provision this bundle", default=True),\n    },\n)\n_LINTERS_BUNDLES_BLOCK = Block(\n    doc="directory bundles keyed by label",\n    additional_properties=_LINTERS_BUNDLE_ITEM_BLOCK.to_node(),\n)\n\n_LINTERS_RULES_BLOCK')
          text = text.replace('    nested={"rules": _LINTERS_RULES_BLOCK},', '    nested={"rules": _LINTERS_RULES_BLOCK, "bundles": _LINTERS_BUNDLES_BLOCK},')
          p.write_text(text)

          # 5) Plan: source-backed class + explicit bundles + provider carrier through catalog.
          p = Path('riglib/plan.py'); text = p.read_text()
          text = text.replace('from .catalog import Catalog, Item', 'from .catalog import Catalog, Item, rule_provider_carrier')
          text = text.replace('from .managed_config import with_managed_header', 'from .managed_config import SOURCE_BACKED, with_managed_header')
          text = text.replace('                    source=f"agent-tools/{source_rel} + rig.yaml selection",\n                )',
                              '                    source=f"agent-tools/{source_rel} + rig.yaml selection",\n                    management_class=SOURCE_BACKED,\n                )')
          items_anchor = '    items = li.get("items", {})\n    item_paths: set[str] = set()\n'
          bundle_plan = '''    bundles = li.get("bundles", {})\n    if isinstance(bundles, dict):\n        for name, spec in bundles.items():\n            if not isinstance(spec, dict) or spec.get("enabled") is False:\n                continue\n            plan.actions.append(Action(\n                kind="provision_linter_bundle", category="linters", item=str(name),\n                source=catalog.source, target=config.repo_root,\n                options={"source_rel": str(spec["source"]), "target_rel": str(spec["target"])},\n            ))\n\n'''
          if 'kind="provision_linter_bundle"' not in text:
              text = text.replace(items_anchor, bundle_plan + items_anchor, 1)
          old = '''    if anti_slop_required(severities):\n        source_root = catalog.source / "vendor" / "anti-slop" / "src"\n        if not source_root.is_dir():\n            raise PlanError(\n                "anti-slop rules are enabled but vendor/anti-slop/src is missing; initialize/update "\n                "the pinned agent-tools submodule"\n            )\n        for source_file in sorted(source_root.rglob("*.ts")):\n            if source_file.name.endswith(".test.ts"):\n                continue\n            rel = source_file.relative_to(source_root).as_posix()\n            target_rel = f"tools/oxlint/anti-slop/{rel}"\n            try:\n                content = source_file.read_text(encoding="utf-8").replace("\\r\\n", "\\n").replace("\\r", "\\n")\n            except (OSError, UnicodeDecodeError) as exc:\n                raise PlanError(f"cannot read anti-slop source {source_file}: {exc}") from exc\n            plan.actions.append(\n                Action(\n                    kind="provision_linter_config",\n                    category="linters",\n                    item=f"anti-slop/{rel}",\n                    source=source_file,\n                    target=config.repo_root,\n                    options={\n                        "tool": "anti-slop",\n                        "role": "linter",\n                        "rel_path": target_rel,\n                        "content": content,\n                        "rig_owned": True,\n                    },\n                )\n            )\n'''
          new = '''    if anti_slop_required(severities):\n        try:\n            source_rel, _source_root = rule_provider_carrier(catalog.source, "anti-slop")\n        except Exception as exc:\n            raise PlanError(str(exc)) from exc\n        if not any(a.kind == "provision_linter_bundle" and a.options.get("target_rel") == "tools/oxlint/anti-slop" for a in plan.actions):\n            plan.actions.append(Action(\n                kind="provision_linter_bundle", category="linters", item="anti-slop",\n                source=catalog.source, target=config.repo_root,\n                options={"source_rel": source_rel, "target_rel": "tools/oxlint/anti-slop"},\n            ))\n'''
          if old not in text:
              raise SystemExit('anti-slop hard-coded source block not found')
          p.write_text(text.replace(old, new, 1))

          # 6) Runner and drift wire bundle; blocked status stays visible.
          p = Path('riglib/actions/runner.py'); text = p.read_text()
          insert = '''\n\ndef _do_provision_linter_bundle(action: Action, on_conflict: str) -> ActionResult:\n    from ..linter_carriers import apply_bundle\n    out = apply_bundle(action.source, action.target, str(action.options.get("source_rel") or ""), str(action.options.get("target_rel") or ""), on_conflict)\n    return ActionResult(action, out.status, out.detail, out.backup)\n'''
          handler_anchor = '\n_HANDLERS: dict[str, Callable[[Action, str], ActionResult]] = {'
          if '_do_provision_linter_bundle' not in text:
              text = text.replace(handler_anchor, insert + handler_anchor, 1)
          text = text.replace('    "lint_policy_blocked": _do_lint_policy_blocked,\n    "provision_linter_config": _do_provision_linter_config,',
                              '    "lint_policy_blocked": _do_lint_policy_blocked,\n    "provision_linter_config": _do_provision_linter_config,\n    "provision_linter_bundle": _do_provision_linter_bundle,')
          p.write_text(text)

          p = Path('riglib/drift.py'); text = p.read_text()
          text = text.replace('        elif action.kind == "provision_linter_config":\n            _check_linter_config(action, report)',
                              '        elif action.kind == "lint_policy_blocked":\n            report.items.append(DriftItem("modified", "linters", action.item, action.target, str(action.options.get("reason") or "lint policy prerequisites are blocked")))\n        elif action.kind == "provision_linter_config":\n            _check_linter_config(action, report)\n        elif action.kind == "provision_linter_bundle":\n            from .linter_carriers import resolve_bundle\n            r = resolve_bundle(action.source, action.target, str(action.options.get("source_rel") or ""), str(action.options.get("target_rel") or ""))\n            if r.state != "ok":\n                direction = "missing" if r.state == "create" else "modified"\n                report.items.append(DriftItem(direction, "linters", action.item, r.target, r.detail or f"linter bundle state: {r.state}"))')
          p.write_text(text)

          # 7) Regression tests: blocked action is non-fail-fast; bundle schema/runtime/status.
          Path('tests/test_lint_followups.py').write_text('''from pathlib import Path\n\nfrom riglib.actions.runner import run_plan\nfrom riglib.plan import Action, InstallPlan\nfrom riglib.drift import detect\nfrom riglib.managed_config import GENERATED, MARKER_MANAGED, SOURCE_BACKED, managed_header\n\ndef test_blocked_lint_action_does_not_short_circuit_other_targets(tmp_path):\n    blocked = Action("lint_policy_blocked", "linters", "rules", tmp_path, tmp_path, {"reason": "missing Oxc", "agent_prompt": "migrate"})\n    later = Action("record_mode", "mode", "later-target", tmp_path, tmp_path, {})\n    report = run_plan(InstallPlan(actions=[blocked, later]))\n    assert [r.status for r in report.results] == ["error", "skipped"]\n    assert report.errors and report.results[1].action.item == "later-target"\n\ndef test_status_surfaces_blocked_lint_policy(tmp_path):\n    action = Action("lint_policy_blocked", "linters", "rules", tmp_path, tmp_path, {"reason": "missing Oxc"})\n    report = detect(InstallPlan(actions=[action]))\n    assert not report.in_sync\n    assert report.items[0].category == "linters" and "missing Oxc" in report.items[0].detail\n\ndef test_managed_file_classes_have_distinct_edit_contracts():\n    g = managed_header("x.ts", management_class=GENERATED)\n    s = managed_header("x.toml", source="agent-tools/x", management_class=SOURCE_BACKED)\n    m = managed_header("x.yml", management_class=MARKER_MANAGED)\n    assert "whole file" in g and "Canonical source" in s and "outside Rig BEGIN/END" in m\n''')

          # Regenerate the committed schema from canonical Python registry.
          import importlib.util, json, sys
          spec = importlib.util.spec_from_file_location('riglib.config_schema', 'riglib/config_schema.py')
          # Use package import after editable install in next step; defer generation there.
          PY
      - name: Install and regenerate schema
        run: |
          pip install -e '.[test]' pyyaml
          python - <<'PY'
          import json
          from pathlib import Path
          from riglib.config_schema import json_schema
          Path('schema/rig.schema.json').write_text(json.dumps(json_schema(), indent=2) + '\n')
          PY
      - name: Validate focused and full suite
        run: |
          python -m pytest -q tests/test_lint_followups.py tests/test_linters.py tests/test_linter_carriers.py tests/test_config_schema.py
          python -m pytest -q
      - name: Commit fixes and remove one-shot workflow
        run: |
          rm .github/workflows/followup-lint-review.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "fix: address merged lint-policy review findings"
          git push origin HEAD:fix/linter-readiness-detection
