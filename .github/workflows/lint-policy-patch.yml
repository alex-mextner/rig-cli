name: Apply lint policy integration patch

on:
  push:
    branches: [feat/linter-bundles]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[lint-policy-integrated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/linter-bundles
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply asserted source transformations
        run: python scripts/_apply_lint_policy_patch.py
      - name: Validate focused tests
        run: |
          python -m pip install -e '.[test]' pyyaml
          python -m pytest -q tests/test_lint_policy.py tests/test_linter_carriers.py tests/test_linters.py tests/test_config_schema.py
      - name: Commit integrated source and remove temporary patch machinery
        run: |
          rm scripts/_apply_lint_policy_patch.py .github/workflows/lint-policy-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: make Rig the lint rule policy source [lint-policy-integrated]"
          git push origin HEAD:feat/linter-bundles
