name: Add lint introspection and formatter default
on:
  push:
    branches: [fix/linter-readiness-detection]
permissions:
  contents: write
jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/linter-readiness-detection
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Implement
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"anchor not found in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, count))

          # Formatter readiness is independent from lint readiness.
          p = Path('riglib/linter_environment.py')
          text = p.read_text()
          if '_FOREIGN_FORMATTER_PACKAGES' not in text:
              text = text.replace(
                  '_OXC_PACKAGES = ("oxlint", "oxfmt", "@oxlint/plugins")',
                  '''_OXC_PACKAGES = ("oxlint", "oxfmt", "@oxlint/plugins")\n_FOREIGN_FORMATTER_PACKAGES = {\n    "prettier": "Prettier",\n    "@biomejs/biome": "Biome",\n    "dprint": "dprint",\n}\n_FOREIGN_FORMATTER_CONFIG_GLOBS = {\n    "Prettier": (".prettierrc", ".prettierrc.*", "prettier.config.*"),\n    "Biome": ("biome.json", "biome.jsonc"),\n    "dprint": ("dprint.json", "dprint.jsonc"),\n}''')
              marker = '\n\ndef inspect_linter_environment(repo_root: Path) -> LinterEnvironment:'
              addition = '''\n\n@dataclass(frozen=True)\nclass FormatterEnvironment:\n    ready: bool\n    oxfmt_present: bool\n    foreign_formatters: tuple[str, ...]\n    reason: str\n    agent_prompt: str\n\n\ndef inspect_formatter_environment(repo_root: Path) -> FormatterEnvironment:\n    """Return repository-local Oxfmt readiness independently of the lint gate."""\n    manifest = _package_manifest(repo_root)\n    packages = _declared_packages(manifest)\n    oxfmt_present = "oxfmt" in packages\n    foreign = {label for pkg, label in _FOREIGN_FORMATTER_PACKAGES.items() if pkg in packages}\n    for label, patterns in _FOREIGN_FORMATTER_CONFIG_GLOBS.items():\n        if any(any(repo_root.glob(pattern)) for pattern in patterns):\n            foreign.add(label)\n    scripts = _script_text(manifest)\n    for token, label in (("prettier", "Prettier"), ("biome", "Biome"), ("dprint", "dprint")):\n        if token in scripts:\n            foreign.add(label)\n    names = tuple(sorted(foreign))\n    if oxfmt_present:\n        reason = "Repository-local Oxfmt is declared; Rig can apply the formatter baseline."\n    elif names:\n        reason = "Rig formatter baseline is blocked because this repository uses " + ", ".join(names) + " but repository-local Oxfmt is not declared."\n    else:\n        reason = "Rig formatter baseline is blocked because no repository-local Oxfmt dependency was detected."\n    prompt = (\n        "Prepare this JS/TS repository for the Rig-managed Oxfmt baseline. "\n        f"Current formatter environment: {', '.join(names) if names else 'no existing formatter'}. "\n        "Install compatible oxfmt as a repository development dependency using the existing package manager; "\n        "migrate format scripts and CI without deleting project-specific formatting semantics; remove obsolete "\n        "formatter configuration only after equivalent behavior is represented; then run `rig apply` again. "\n        "Do not hand-edit the Rig-managed .oxfmtrc.jsonc target; change Rig/agent-tools policy instead."\n    )\n    return FormatterEnvironment(oxfmt_present, oxfmt_present, names, reason, prompt)\n'''
              text = text.replace(marker, addition + marker, 1)
              p.write_text(text)

          # Plan Oxfmt separately BEFORE an Oxlint readiness return.
          p = Path('riglib/plan.py')
          text = p.read_text()
          text = text.replace(
              'from .linter_environment import inspect_linter_environment',
              'from .linter_environment import inspect_formatter_environment, inspect_linter_environment',
              1,
          )
          anchor = '    env = inspect_linter_environment(config.repo_root)\n    blocked_reason = ""\n'
          formatter_block = '''    env = inspect_linter_environment(config.repo_root)\n    formatter_env = inspect_formatter_environment(config.repo_root)\n    if ".oxfmtrc.jsonc" not in item_paths:\n        if formatter_env.ready:\n            source_rel = "linters/oxc/.oxfmtrc.jsonc"\n            source_file = catalog.source / source_rel\n            if not source_file.is_file():\n                raise PlanError(f"Oxfmt carrier is missing: {source_file}")\n            try:\n                formatter_content = source_file.read_text(encoding="utf-8").replace("\\r\\n", "\\n").replace("\\r", "\\n")\n            except (OSError, UnicodeDecodeError) as exc:\n                raise PlanError(f"cannot read Oxfmt carrier {source_file}: {exc}") from exc\n            formatter_content = with_managed_header(\n                ".oxfmtrc.jsonc", formatter_content,\n                source=f"agent-tools/{source_rel}", management_class=SOURCE_BACKED,\n            )\n            plan.actions.append(Action(\n                kind="provision_linter_config", category="linters", item="rig-oxfmt-baseline",\n                source=source_file, target=config.repo_root,\n                options={"tool": "oxfmt", "role": "formatter", "rel_path": ".oxfmtrc.jsonc",\n                         "content": formatter_content, "rig_owned": True},\n            ))\n            if formatter_env.foreign_formatters:\n                plan.notes.append(\n                    "formatters: Oxfmt is available alongside " + ", ".join(formatter_env.foreign_formatters)\n                    + "; Rig applies the Oxfmt baseline but duplicate/conflicting format scripts should be migrated deliberately"\n                )\n        else:\n            plan.actions.append(Action(\n                kind="format_policy_blocked", category="linters", item="formatter",\n                source=catalog.source, target=config.repo_root,\n                options={"reason": formatter_env.reason, "agent_prompt": formatter_env.agent_prompt},\n            ))\n\n    blocked_reason = ""\n'''
          if anchor not in text:
              raise SystemExit('plan linter environment anchor not found')
          p.write_text(text.replace(anchor, formatter_block, 1))

          # Separate non-mutating formatter blocked action; executor remains collect-and-continue.
          p = Path('riglib/actions/runner.py')
          text = p.read_text()
          lint_fun_anchor = 'def _do_lint_policy_blocked(action: Action, on_conflict: str) -> ActionResult:\n'
          if 'def _do_format_policy_blocked' not in text:
              idx = text.index(lint_fun_anchor)
              next_def = text.index('\n\ndef ', idx + len(lint_fun_anchor))
              addition = '''\n\ndef _do_format_policy_blocked(action: Action, on_conflict: str) -> ActionResult:\n    """Surface formatter readiness as one failed target without aborting later actions."""\n    reason = str(action.options.get("reason") or "Oxfmt formatter prerequisites are not satisfied")\n    prompt = str(action.options.get("agent_prompt") or "").strip()\n    detail = f"format-policy: BLOCKED — {reason}"\n    if prompt:\n        detail += f" Agent/employee migration prompt: {prompt}"\n    return ActionResult(action, "error", detail)\n'''
              text = text[:next_def] + addition + text[next_def:]
          text = text.replace(
              '    "lint_policy_blocked": _do_lint_policy_blocked,\n',
              '    "lint_policy_blocked": _do_lint_policy_blocked,\n    "format_policy_blocked": _do_format_policy_blocked,\n',
              1,
          )
          p.write_text(text)

          p = Path('riglib/drift.py')
          text = p.read_text()
          old = '''        elif action.kind == "lint_policy_blocked":\n            report.items.append(DriftItem("modified", "linters", action.item, action.target, str(action.options.get("reason") or "lint policy prerequisites are blocked")))\n'''
          new = old + '''        elif action.kind == "format_policy_blocked":\n            report.items.append(DriftItem("modified", "linters", action.item, action.target, str(action.options.get("reason") or "formatter policy prerequisites are blocked")))\n'''
          if old not in text:
              raise SystemExit('drift lint blocked anchor missing')
          p.write_text(text.replace(old, new, 1))

          # `rig lint rules`, reserving top-level `rig rules` for future cross-domain policies.
          Path('riglib/lint_rules_cli.py').write_text('''"""Effective lint-rule introspection for `rig lint rules`."""\nfrom __future__ import annotations\n\nimport json\nfrom pathlib import Path\nfrom typing import Any\n\nfrom .config import load\nfrom .detect import detect_environment\nfrom .lint_policy import RULES, resolve_rule_severities\n\ndef _reason(name: str, spec, cfg: dict[str, Any]) -> str:\n    severity = cfg.get("severity") if isinstance(cfg.get("severity"), dict) else {}\n    if name in severity:\n        return "explicit severity"\n    disabled = cfg.get("disable") if isinstance(cfg.get("disable"), list) else []\n    if name in disabled:\n        return "explicit disable"\n    enabled = cfg.get("enable") if isinstance(cfg.get("enable"), list) else []\n    if name in enabled:\n        return "explicit enable"\n    groups = cfg.get("groups") if isinstance(cfg.get("groups"), dict) else {}\n    if spec.group in groups:\n        return f"group {spec.group}={str(groups[spec.group]).lower()}"\n    if cfg.get("all") is True:\n        return "all=true"\n    return "built-in default"\n\ndef rows(cwd: str, config_path: str | None = None) -> list[dict[str, str]]:\n    env = detect_environment(Path(cwd).resolve())\n    explicit = None\n    if config_path:\n        cp = Path(config_path)\n        explicit = (cp if cp.is_absolute() else env.repo_root / cp).resolve()\n    loaded = load(env.repo_root, explicit_config=explicit, include_repo=env.is_git_repo or explicit is not None)\n    linters = loaded.data.get("linters") if isinstance(loaded.data.get("linters"), dict) else {}\n    cfg = linters.get("rules") if isinstance(linters.get("rules"), dict) else {}\n    effective = resolve_rule_severities(cfg)\n    return [\n        {\n            "rule": spec.name,\n            "effective": effective[spec.name],\n            "default": spec.default,\n            "all": spec.all_severity,\n            "group": spec.group,\n            "provider": spec.provider,\n            "reason": _reason(spec.name, spec, cfg),\n        }\n        for spec in RULES\n    ]\n\ndef run(args) -> int:\n    if getattr(args, "lint_command", None) != "rules":\n        args._lint_parser.print_help()\n        return 0\n    data = rows(args.cwd, args.config)\n    if args.rule:\n        data = [row for row in data if row["rule"] == args.rule]\n        if not data:\n            print(f"unknown lint rule: {args.rule}")\n            return 4\n    if args.json:\n        print(json.dumps(data, indent=2, sort_keys=True))\n        return 0\n    if not data:\n        return 0\n    widths = {key: max(len(key), *(len(row[key]) for row in data)) for key in ("effective", "default", "all", "group", "provider")}\n    for row in data:\n        print(\n            f"{row['effective']:<{widths['effective']}}  {row['rule']}  "\n            f"[default={row['default']:<{widths['default']}} all={row['all']:<{widths['all']}} "\n            f"group={row['group']:<{widths['group']}} provider={row['provider']:<{widths['provider']}}]  {row['reason']}"\n        )\n    return 0\n''')

          p = Path('riglib/cli.py')
          text = p.read_text()
          text = text.replace('    _add_stats_parser(sub)\n    _add_codex_parser(sub)', '    _add_lint_parser(sub)\n    _add_stats_parser(sub)\n    _add_codex_parser(sub)', 1)
          stats_anchor = 'def _add_stats_parser(sub: "argparse._SubParsersAction") -> None:\n'
          if 'def _add_lint_parser' not in text:
              lint_parser = '''def _add_lint_parser(sub: "argparse._SubParsersAction") -> None:\n    """`rig lint rules` — lint-domain policy introspection; top-level `rig rules` stays cross-domain."""\n    lp = sub.add_parser("lint", help="lint/format policy inspection")\n    lp.set_defaults(_lint_parser=lp)\n    lsub = lp.add_subparsers(dest="lint_command", metavar="<action>")\n    rp = lsub.add_parser("rules", help="show the effective lint rule policy and provider selection")\n    rp.add_argument("rule", nargs="?", help="show one exact rule name")\n    rp.add_argument("-C", "--cwd", default=".", help="repo root (default: cwd)")\n    rp.add_argument("--config", help="config file (default: ./rig.yaml + global)")\n    rp.add_argument("--json", action="store_true", help="emit machine-readable JSON")\n\n\n'''
              text = text.replace(stats_anchor, lint_parser + stats_anchor, 1)
          text = text.replace('        "stats": cmd_stats,\n', '        "lint": cmd_lint,\n        "stats": cmd_stats,\n', 1)
          cmd_stats_anchor = 'def cmd_stats(args: argparse.Namespace) -> int:\n'
          if 'def cmd_lint(' not in text:
              cmd_lint = '''def cmd_lint(args: argparse.Namespace) -> int:\n    from .lint_rules_cli import run\n    return run(args)\n\n\n'''
              text = text.replace(cmd_stats_anchor, cmd_lint + cmd_stats_anchor, 1)
          p.write_text(text)

          # Focused regression tests.
          Path('tests/test_lint_cli_and_formatter.py').write_text('''import json\n\nfrom riglib.cli import build_parser, main\nfrom riglib.linter_environment import inspect_formatter_environment\n\ndef _pkg(repo, dev=None, scripts=None):\n    payload = {"devDependencies": dev or {}}\n    if scripts:\n        payload["scripts"] = scripts\n    (repo / "package.json").write_text(json.dumps(payload), encoding="utf-8")\n\ndef test_lint_rules_parser_is_nested_not_top_level_rules():\n    args = build_parser().parse_args(["lint", "rules", "--json"])\n    assert args.command == "lint" and args.lint_command == "rules" and args.json\n\ndef test_lint_rules_json_reports_provider_and_effective_policy(tmp_path, monkeypatch, capsys):\n    monkeypatch.setenv("XDG_CONFIG_HOME", str(tmp_path / "xdg"))\n    repo = tmp_path / "repo"; repo.mkdir(); (repo / ".git").mkdir()\n    (repo / "rig.yaml").write_text("version: 1\\nlinters:\\n  rules:\\n    all: true\\n", encoding="utf-8")\n    rc = main(["lint", "rules", "anti-slop/no-optional-function-parameters", "-C", str(repo), "--json"])\n    assert rc == 0\n    data = json.loads(capsys.readouterr().out)\n    assert data[0]["provider"] == "anti-slop" and data[0]["effective"] == "error" and data[0]["reason"] == "all=true"\n\ndef test_formatter_readiness_detects_prettier_without_oxfmt(tmp_path):\n    repo = tmp_path / "repo"; repo.mkdir(); _pkg(repo, {"prettier": "x"})\n    env = inspect_formatter_environment(repo)\n    assert not env.ready and env.foreign_formatters == ("Prettier",)\n\ndef test_formatter_ready_with_repo_local_oxfmt_even_if_prettier_coexists(tmp_path):\n    repo = tmp_path / "repo"; repo.mkdir(); _pkg(repo, {"oxfmt": "x", "prettier": "x"})\n    env = inspect_formatter_environment(repo)\n    assert env.ready and env.oxfmt_present and env.foreign_formatters == ("Prettier",)\n''')
          PY
      - name: Validate
        run: |
          pip install -e '.[test]' pyyaml
          python -m pytest -q tests/test_lint_cli_and_formatter.py tests/test_linter_environment.py tests/test_lint_followups.py tests/test_linters.py
          python -m pytest -q
      - name: Commit
        run: |
          rm .github/workflows/followup-lint-cli-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "feat: add lint policy introspection and Oxfmt default"
          git push origin HEAD:fix/linter-readiness-detection
